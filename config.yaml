# CAMERA AI - FINAL COLAB VIDEO CONFIG (2026-11-02)
# Video face detection: SCRFD 960.
# Enrollment: pass --enrollment-det-size 640 to enroll.py (does NOT edit this YAML).
# Scores 0.20/0.07 are EXPERIMENTAL, not calibrated for deployment.
# roi.json takes precedence over roi.points; preserve your edited roi.json.
input:
  fallback_fps: 30.0
roi:
  file: roi.json
  points:
  - - 0.25
    - 0.08
  - - 0.75
    - 0.08
  - - 0.85
    - 0.92
  - - 0.15
    - 0.92
  context_margin_fraction: 0.12
undistort:
  mode: none
  calibration_file: camera_calibration.npz
  alpha: 0.0
  balance: 0.0
person:
  model: yolo26s.pt
  imgsz: 960
  confidence: 0.1
  iou: 0.7
  lost_seconds: 2.0
  tracker:
    track_high_thresh: 0.35
    track_low_thresh: 0.1
    new_track_thresh: 0.45
    match_thresh: 0.8
    fuse_score: true
    gmc_method: none
    with_reid: true
    model: auto
    proximity_thresh: 0.35
    appearance_thresh: 0.8
face:
  model_pack: buffalo_l
  onnx_path: null
  input_size:
  - 960
  - 960
  confidence: 0.4
  every_n_frames: 2
  crop_padding: 0.12
  person_crop_height_fraction: 1.0
  rotation_angles:
  - -30
  - 30
  rotation_every_n_frames: 6
  rotate_only_if_empty: true
  nms_iou: 0.4
association:
  person_padding: 0.08
  min_face_coverage: 0.85
  max_face_person_ratio: 0.9
  expected_head_xy:
  - 0.5
  - 0.25
  ambiguity_margin: 0.1
  max_cost: 0.7
quality:
  min_det_score: 0.55
  min_face_px: 32
  min_eye_distance_px: 8
  min_sharpness: 12.0
  min_brightness: 25.0
  max_brightness: 230.0
  medium:
    min_det_score: 0.4
    min_face_px: 24
    min_eye_distance_px: 5
    min_sharpness: 5.0
    min_brightness: 20.0
    max_brightness: 235.0
gallery:
  top_k: 5
  min_track_observations: 3
  min_sample_gap_s: 0.4
  crop_padding: 0.18
  save_aligned: true
  aligned_size: 112
  recognition_high_k: 5
  recognition_medium_k: 10
  recognition_min_sample_gap_s: 0.4
recognition:
  enabled: true
  model_pack: buffalo_l
  onnx_path: null
  model_id: null
  database_path: /content/data/face_database.npz
identity:
  min_match_score: 0.2
  min_margin: 0.07
  min_evidence: 3
  min_high_evidence: 1
  min_strong_support: 2
  min_vote_fraction: 0.75
  min_span_s: 0.8
  min_sample_gap_s: 0.4
  high_k: 5
  medium_k: 10
  medium_weight: 0.5
  score_mode: template_topk
  template_top_k: 2
  allow_single_identity: false
output:
  directory: outputs
  save_video: true
